name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build -c Release -warnaserror -p:Version=$env:VERSION
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/AgentSessions -c Release --no-build -p:Version=$env:VERSION -o out
      - name: Smoke test via dnx
        shell: bash
        run: dnx AgentSessions --version "$VERSION" --source ./out --yes -- --version
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: out/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: out
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --generate-notes ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
